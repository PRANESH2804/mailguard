# ==============================================================================
# MailGuard Splunk Saved Searches & Detection Rules
# Sourcetype: mailguard:analysis | Index: security_lab
# ==============================================================================

# Detection A: High-risk or suspected spoofed emails grouped by sender domain
[MailGuard - Suspected Spoofed Emails by Sender Domain]
search = index=security_lab sourcetype="mailguard:analysis" verdict="SPOOFED" \
| stats count, values(subject) as subjects, values(originating_ip) as src_ips, avg(risk_score) as avg_risk by from_domain \
| eval avg_risk=round(avg_risk, 1) \
| sort - count \
| where count >= 1
description = Identifies domains generating high volumes of suspected spoofed emails failing SPF/DKIM/DMARC authentication.
alert.severity = 4
alert.suppress = 0
dispatch.earliest_time = -24h
dispatch.latest_time = now

# Detection B: SPF, DKIM, and DMARC failure spikes over time
[MailGuard - Authentication Failure Spikes Over Time]
search = index=security_lab sourcetype="mailguard:analysis" \
| eval spf_fail=if('spf.status'!="PASS", 1, 0), dkim_fail=if('dkim.overall_status'!="PASS", 1, 0), dmarc_fail=if('dmarc.status'!="PASS", 1, 0) \
| timechart span=1h sum(spf_fail) as total_spf_failures, sum(dkim_fail) as total_dkim_failures, sum(dmarc_fail) as total_dmarc_failures
description = Monitors temporal velocity of authentication protocol breakdowns across monitored gateways.
alert.severity = 3
dispatch.earliest_time = -7d
dispatch.latest_time = now

# Detection C: Lookalike-domain findings and possible impersonation campaigns
[MailGuard - Typosquatting and Lookalike Domain Campaign]
search = index=security_lab sourcetype="mailguard:analysis" "heuristics{}.id"="HEUR-LOOKALIKE-DOMAIN" OR "heuristics{}.id"="HEUR-BRAND-COMBOSQUATTING" \
| stats count, values(from_address) as senders, values(subject) as subjects, values(heuristics{}.evidence) as evidence by from_domain \
| sort - count
description = Detects active spearphishing campaigns leveraging typosquatting, homoglyphs, or brand combosquatting.
alert.severity = 4
dispatch.earliest_time = -24h
dispatch.latest_time = now

# Detection D: Risky attachments including executable and macro-enabled extensions
[MailGuard - Dangerous or Double-Extension Attachments]
search = index=security_lab sourcetype="mailguard:analysis" "attachments{}.is_risky"=true OR "attachments{}.is_double_extension"=true \
| mvexpand "attachments{}" \
| search "attachments{}.is_risky"=true OR "attachments{}.is_double_extension"=true \
| table _time, from_address, recipients{}, "attachments{}.filename", "attachments{}.sha256", "attachments{}.detected_extensions{}", risk_score, verdict
description = Alerts on initial access attempts delivering executable binaries, scripts, or disguised double extensions.
alert.severity = 5
dispatch.earliest_time = -24h
dispatch.latest_time = now

# Detection E: Top targeted recipients
[MailGuard - Most Targeted Internal Recipients]
search = index=security_lab sourcetype="mailguard:analysis" verdict IN ("SUSPICIOUS", "SPOOFED") \
| mvexpand recipients{} \
| stats count, values(from_address) as attackers, dc(from_domain) as unique_sender_domains by recipients{} \
| rename recipients{} as target_user \
| sort - count \
| head 20
description = Surfaces employees subjected to disproportionate phishing lures and spoofing attacks.
alert.severity = 3
dispatch.earliest_time = -7d
dispatch.latest_time = now

# Detection F: Repeated suspicious messages from the same source IP
[MailGuard - Persistent Malicious Sender IP]
search = index=security_lab sourcetype="mailguard:analysis" verdict IN ("SUSPICIOUS", "SPOOFED") originating_ip=* \
| stats count, dc(from_domain) as spoofed_domains, values(subject) as subjects, values(from_address) as senders by originating_ip \
| where count >= 2 \
| sort - count
description = Identifies persistent adversary MTA infrastructure sending multiple suspicious emails across different domains.
alert.severity = 4
dispatch.earliest_time = -24h
dispatch.latest_time = now

# Detection G: High-risk messages requiring immediate SOC triage
[MailGuard - Critical Severity Email Requiring Immediate SOC Triage]
search = index=security_lab sourcetype="mailguard:analysis" risk_score >= 70 \
| table _time, message_id, from_address, recipients{}, subject, risk_score, "spf.status", "dkim.overall_status", "dmarc.status", top_reasons{} \
| sort - risk_score
description = Real-time SOC analyst dispatch queue for emails classified as high-confidence spoofing.
alert.severity = 5
dispatch.earliest_time = -4h
dispatch.latest_time = now
