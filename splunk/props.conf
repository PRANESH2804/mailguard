# ==============================================================================
# MailGuard Splunk Props Configuration
# Sourcetype: mailguard:analysis
# ==============================================================================

[mailguard:analysis]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 999999
TIME_PREFIX = "timestamp":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
MAX_TIMESTAMP_LOOKAHEAD = 35

# JSON Field Extraction
INDEXED_EXTRACTIONS = json
KV_MODE = none
AUTO_KV_JSON = true

# Field Aliases aligning with Splunk Common Information Model (CIM) Email Data Model
FIELDALIAS-mailguard_cim_src = originating_ip AS src
FIELDALIAS-mailguard_cim_recipient = recipients{} AS recipient
FIELDALIAS-mailguard_cim_src_user = from_address AS src_user
FIELDALIAS-mailguard_cim_subject = subject AS message_subject
FIELDALIAS-mailguard_cim_signature = verdict AS action

# Calculated Fields & Lookups
EVAL-risk_category = case(risk_score>=70, "Critical", risk_score>=31, "Medium", true(), "Low")
EVAL-is_spoofed = if(verdict=="SPOOFED", 1, 0)
EVAL-auth_failure_count = (if('spf.status'!="PASS", 1, 0) + if('dkim.overall_status'!="PASS", 1, 0) + if('dmarc.status'!="PASS", 1, 0))
