[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mailguard"
version = "1.0.0"
description = "MailGuard: Email Authentication & Spoofing Analyzer for SOC and Detection Engineering"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Pranesh", email = "security@example.com"}
]
keywords = ["cybersecurity", "email-security", "spf", "dkim", "dmarc", "splunk", "soc", "detection-engineering"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "cryptography>=41.0.0",
    "dkimpy>=1.1.0",
    "dnspython>=2.4.0",
    "flask>=3.0.0",
    "pyspf>=2.0.14",
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
    "rapidfuzz>=3.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "tldextract>=5.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mailguard*"]

[project.scripts]
mailguard = "mailguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
